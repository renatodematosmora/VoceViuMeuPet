name: voce_viu_meu_pet
description: "Rede social para busca de animais perdidos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Maps
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # UI & Design
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # Forms & Input
  image_picker: ^1.1.2

  # Location (handled via browser Geolocation API on web)
  # geolocator and geocoding removed - mobile-only, break flutter web

  # Storage & Persistence
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Internationalization
  intl: ^0.20.2

  # Utils
  timeago: ^3.7.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  permission_handler: ^11.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  json_serializable: ^6.9.5
  freezed: ^2.5.8
  freezed_annotation: ^2.4.4
  flutter_gen_runner: ^5.10.0
  mocktail: ^1.0.5
  coverage: ^1.15.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
